name: launch_at_login_example
description: "Flutter example for nativeapi launch-at-login."
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # DazzUI plus the host every example shares (the WidgetsApp, the theme, the chips).
