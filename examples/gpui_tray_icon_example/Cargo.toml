[package]
name = "gpui_tray_icon_example"
version = "0.1.0"
edition = "2021"
publish = false

# Kept out of the root workspace: gpui is a large dependency with its own
# platform requirements, and the workspace CI builds every member.
[workspace]

[dependencies]
nativeapi = { path = "../../bindings/rust/nativeapi" }
nativeapi_gpui = { path = "../../bindings/rust/nativeapi_gpui" }
# Compile shaders at startup: no Metal toolchain needed to build on macOS.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# The DazzUI design system for GPUI: the same tokens, themes and components
# the Flutter example's DazzUI host draws with.
dazzui = { git = "https://github.com/dazzlabs/dazzui", branch = "cargo-root-workspace" }
# The frames the animator hands to the tray are drawn on the CPU.
tiny-skia = "0.11"
# Decoding the bundled still icon and building preview images for the window.
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
base64 = "0.22"
futures = "0.3"
